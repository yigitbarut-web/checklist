<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checklist">
<meta name="description" content="Sade ve hızlı yapılacaklar listesi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>My Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}

/* Layout: tek sütun mobil uygulama — saydam büyük başlık + kategori sekmeleri (yapışkan), aktif kategorinin rengiyle boyanan arka plan ışığı, altta cam efektli hızlı ekleme + sekme çubuğu */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F2F4F8; --track:rgba(16,24,40,.06); --track-2:rgba(16,24,40,.12);
  --fg:#0B0E16; --fg-2:#384051; --muted:#6B7385; --faint:#A3AABA;
  --line:rgba(16,24,40,.08); --line-2:rgba(16,24,40,.16);
  --glass:rgba(244,246,250,.8);
  --brand:#4F5BF5; --on-cat:#FFFFFF;
  --danger:#E5484D; --warn:#E5900B; --ok:#20A35A;
  --c-blue:#2F6BFF; --c-indigo:#4F5BF5; --c-purple:#8B5CF6; --c-pink:#E64592; --c-red:#E5484D;
  --c-orange:#EE6C1B; --c-amber:#C2850A; --c-green:#1E9E55; --c-teal:#0C9A99; --c-slate:#64748B;
  --cat:var(--brand); --glow:20%; --glow2:12%;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 1px 2px rgba(16,24,40,.04),0 12px 32px -10px rgba(16,24,40,.16);
  --scrim:rgba(10,12,20,.38);
  --f-display:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07080C; --surface:#13151C; --surface-2:#1B1E27; --track:rgba(255,255,255,.07); --track-2:rgba(255,255,255,.16);
  --fg:#F2F4F8; --fg-2:#C6CBD7; --muted:#8B93A7; --faint:#565D70;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --glass:rgba(12,14,19,.78);
  --brand:#8189FF; --on-cat:#0B0E16;
  --danger:#FF6B6F; --warn:#F5B544; --ok:#3DD68C;
  --c-blue:#6E9BFF; --c-indigo:#8189FF; --c-purple:#B197FC; --c-pink:#F783AC; --c-red:#FF8787;
  --c-orange:#FFA94D; --c-amber:#FCC54A; --c-green:#51CF8A; --c-teal:#3BD4C9; --c-slate:#A3AFC2;
  --glow:24%; --glow2:14%;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.35),0 14px 34px -12px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07080C; --surface:#13151C; --surface-2:#1B1E27; --track:rgba(255,255,255,.07); --track-2:rgba(255,255,255,.16);
  --fg:#F2F4F8; --fg-2:#C6CBD7; --muted:#8B93A7; --faint:#565D70;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --glass:rgba(12,14,19,.78);
  --brand:#8189FF; --on-cat:#0B0E16;
  --danger:#FF6B6F; --warn:#F5B544; --ok:#3DD68C;
  --c-blue:#6E9BFF; --c-indigo:#8189FF; --c-purple:#B197FC; --c-pink:#F783AC; --c-red:#FF8787;
  --c-orange:#FFA94D; --c-amber:#FCC54A; --c-green:#51CF8A; --c-teal:#3BD4C9; --c-slate:#A3AFC2;
  --glow:24%; --glow2:14%;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.35),0 14px 34px -12px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:transparent;transition:background .2s}
body.scrolled::before{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cat);outline-offset:2px;border-radius:10px}
svg{display:block}

.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(110% 55% at 10% -12%,color-mix(in srgb,var(--cat) var(--glow),transparent),transparent 65%),
             radial-gradient(70% 45% at 105% 2%,color-mix(in srgb,var(--cat) var(--glow2),transparent),transparent 70%)}
.app{position:relative;z-index:1}
main{max-width:600px;margin:0 auto;padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));
  padding-top:10px;padding-bottom:10px;padding-left:var(--gl);padding-right:var(--gr);transition:background .2s,box-shadow .2s}
body.scrolled .top{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 var(--line)}
.top-in{max-width:600px;margin:0 auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em;min-width:0}
.acts{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);color:var(--fg-2);transition:transform .12s}
.icon-btn svg{width:18px;height:18px}
.icon-btn:active{transform:scale(.92)}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.025em;line-height:1.1;margin:0;text-wrap:balance}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);border-radius:12px;padding:0 12px;height:42px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:16px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search button{color:var(--cat);font-weight:600;font-size:15px}

/* category tabs */
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));
  padding:2px var(--gr) 4px var(--gl);scroll-padding-inline:var(--gl)}
.cats::-webkit-scrollbar{display:none}
.cat{--c:var(--brand);flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh-1);font-weight:600;font-size:14px;color:var(--fg-2);transition:background .2s,color .2s,box-shadow .2s,transform .12s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cat:active{transform:scale(.95)}
.cat-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);transition:inherit}
.cat-ic svg{width:14px;height:14px}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--track);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cat[aria-selected="true"]{background:var(--c);color:var(--on-cat);border-color:transparent;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--c) 75%,transparent)}
.cat[aria-selected="true"] .cat-ic,.cat[aria-selected="true"] .cnt{background:color-mix(in srgb,var(--on-cat) 20%,transparent);color:var(--on-cat)}
.cat.sq{width:38px;padding:0;justify-content:center;color:var(--muted)}
.cat.sq svg{width:18px;height:18px}

/* hero */
.hero{position:relative;overflow:hidden;margin-top:8px;border-radius:24px;padding:20px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--cat) 17%,var(--surface)) 0%,var(--surface) 78%);
  border:1px solid color-mix(in srgb,var(--cat) 20%,var(--line));box-shadow:var(--sh-2)}
.hero-l{position:relative;z-index:1;max-width:78%}
.hero-k{font-size:12px;font-weight:800;color:var(--cat);letter-spacing:.08em;text-transform:uppercase}
.hero-n{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.hero-n small{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.hero-n.sm{font-size:30px}
.pbar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--cat) 13%,var(--track));margin-top:16px;overflow:hidden;position:relative;z-index:1}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--cat);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hero-s{position:relative;z-index:1;margin-top:10px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.hero-s b{color:var(--fg);font-weight:600}
.hero-art{position:absolute;right:-14px;top:-10px;width:128px;height:128px;color:var(--cat);opacity:.13}
.hero-art svg{width:100%;height:100%}

.banner{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--line-2);font-size:14px;color:var(--fg-2)}
.banner span{flex:1;min-width:0}
.banner button{color:var(--cat);font-weight:700;flex:none}

/* sections + rows */
.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 8px}
.sec-h h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sec-h h3 .n{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.sec-h.danger h3{color:var(--danger)}
.sec-h.mute h3{color:var(--muted)}
.act{color:var(--cat);font-weight:600;font-size:14px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.row{position:relative;overflow:hidden;transition:height .26s ease,opacity .26s ease}
.row + .row .row-in::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line)}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;font-size:14px;color:#fff}
.swipe-bg span{display:flex;align-items:center;gap:6px;opacity:0}
.swipe-bg svg{width:16px;height:16px}
.row.sw-r .swipe-bg{background:var(--ok)} .row.sw-r .l{opacity:1}
.row.sw-l .swipe-bg{background:var(--danger)} .row.sw-l .r{opacity:1}
.row-in{position:relative;display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--surface);touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
.row-in.snap{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.row.leaving{opacity:0}
.chk{--c:var(--cat);flex:none;width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 70%,var(--faint));display:grid;place-items:center;transition:transform .12s,background .18s,border-color .18s}
.chk svg{width:13px;height:13px;stroke:var(--on-cat);opacity:0;transform:scale(.4);transition:all .2s}
.chk:active{transform:scale(.86)}
.chk.on,.row.done .chk{background:var(--c);border-color:var(--c)}
.chk.on svg,.row.done .chk svg{opacity:1;transform:none}
.row.done .chk{opacity:.5}
.row-main{flex:1;min-width:0;padding-top:1px}
.row-title{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.row.done .row-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:13px;color:var(--muted)}
.meta > span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px}
.meta .late{color:var(--danger);font-weight:600}
.tag{color:var(--c);font-weight:600}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}
.row-end{flex:none;display:flex;align-items:center;gap:6px;padding-top:2px}
.tm{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tm.late{color:var(--danger)}
.flag{width:14px;height:14px}
.flag.p1{color:var(--c-blue)} .flag.p2{color:var(--warn)} .flag.p3{color:var(--danger)}

.empty{text-align:center;padding:44px 20px 16px;color:var(--muted)}
.empty .big{width:72px;height:72px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat) 13%,var(--surface));color:var(--cat);border:1px solid color-mix(in srgb,var(--cat) 20%,transparent)}
.empty .big svg{width:32px;height:32px}
.empty h3{font-family:var(--f-display);font-size:20px;color:var(--fg);margin:0 0 6px}
.empty p{margin:0 auto;font-size:15px;max-width:32ch}

/* planned strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px) / 7);gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:8px;padding:2px 0 6px}
.strip::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start;display:grid;justify-items:center;gap:3px;padding:9px 0 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);transition:background .2s,transform .12s}
.day:active{transform:scale(.95)}
.day small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day b{font-family:var(--f-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.day i{display:flex;gap:3px;height:5px}
.day i span{width:5px;height:5px;border-radius:50%;background:var(--cat)}
.day.today small{color:var(--cat)}
.day.on{background:var(--cat);border-color:transparent;color:var(--on-cat);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--cat) 75%,transparent)}
.day.on small{color:var(--on-cat);opacity:.8} .day.on i span{background:var(--on-cat)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);padding:0 4px;transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
main > .seg{margin-top:8px}

/* focus */
.timer{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-2);padding:22px 18px;margin-top:8px;display:grid;justify-items:center;gap:18px}
.dial{position:relative;width:min(240px,70vw);aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .tr{stroke:var(--track)} .dial .pr{stroke:var(--cat);transition:stroke-dashoffset .3s linear}
.dial.brk .pr{stroke:var(--ok)}
.dial-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial-t{font-family:var(--f-display);font-weight:700;font-size:56px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.dial-s{font-size:12px;color:var(--muted);margin-top:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fsel{width:100%;max-width:340px}
.fsel select{width:100%;height:46px;border-radius:12px;border:0;background:var(--surface-2);padding:0 12px;font-size:15px}
.ctrl{display:flex;gap:16px;align-items:center}
.play{width:68px;height:68px;border-radius:50%;background:var(--cat);color:var(--on-cat);display:grid;place-items:center;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--cat) 70%,transparent);transition:transform .12s}
.play:active{transform:scale(.94)}
.play svg{width:28px;height:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 12px}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px 14px 12px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px}
.bar{display:grid;grid-template-rows:1fr auto auto;justify-items:center;gap:4px;height:100%}
.bar i{width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:color-mix(in srgb,var(--cat) 22%,var(--track));align-self:end;min-height:4px;display:block}
.bar.now i{background:var(--cat)}
.bar em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.bar small{font-size:11px;color:var(--faint);font-weight:700}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:600px;margin:0 auto;position:relative}
.preview{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 8px}
.pv{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--cat) 14%,var(--surface));color:var(--cat);display:inline-flex;align-items:center;gap:5px}
.pv svg{width:12px;height:12px}
.composer{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-2);padding:6px}
.tgt{--c:var(--brand);flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;max-width:44%;padding:0 8px 0 5px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font-size:13px;font-weight:700}
.tgt .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:var(--on-cat);flex:none}
.tgt .ti svg{width:15px;height:15px}
.tgt .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt .cv{width:12px;height:12px;flex:none;opacity:.8}
.composer input{flex:1;min-width:0;border:0;background:none;outline:none;height:38px;font-size:16px;padding:0 4px}
.composer input::placeholder{color:var(--faint)}
.send{width:38px;height:38px;border-radius:12px;background:var(--cat);color:var(--on-cat);display:grid;place-items:center;flex:none;transition:background .15s,transform .12s}
.send:disabled{background:var(--track);color:var(--faint)}
.send:not(:disabled):active{transform:scale(.92)}
.send svg{width:18px;height:18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:4px}

.icn svg{width:22px;height:22px}

canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

function parse(raw){
  let s=' '+raw+' ';const r={due:null,time:null,repeat:'none',prio:0,list:null};
  const cut=(re,fn)=>{const m=low(s).match(re);if(m&&fn(m)!==false)s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)};
  const wd='(pazartesi|cumartesi|çarşamba|perşembe|salı|cuma|pazar)';
  const wdIdx=w=>({pazar:0,pazartesi:1,salı:2,çarşamba:3,perşembe:4,cuma:5,cumartesi:6})[w];
  const nextW=(i,allow0)=>{let n=(i-new Date().getDay()+7)%7;if(!n&&!allow0)n=7;return add(T(),n)};
  cut(/\s(!{1,3})(?=\s)/,m=>{r.prio=m[1].length});
  cut(/\s#(\S+)(?=\s)/,m=>{const k=m[1];const l=S.cats.find(l=>low(l.name).replace(/\s/g,'').startsWith(k));if(!l)return false;r.list=l.id});
  cut(new RegExp('\\sher '+wd+'(?=\\s)'),m=>{r.repeat='weekly';r.due=nextW(wdIdx(m[1]),true)});
  cut(/\shafta ?içi(?=\s)/,()=>{r.repeat='weekdays'});
  cut(/\sher gün(?=\s)/,()=>{r.repeat='daily'});
  cut(/\sher hafta(?=\s)/,()=>{r.repeat='weekly'});
  cut(/\sher ay(?=\s)/,()=>{r.repeat='monthly'});
  cut(/\s(bugün|yarın|öbür gün|haftaya|hafta sonu)(?=\s)/,m=>{const w=m[1];r.due=w==='bugün'?T():w==='yarın'?add(T(),1):w==='öbür gün'?add(T(),2):w==='haftaya'?nextW(1):nextW(6,true)});
  if(!r.due)cut(new RegExp('\\s'+wd+'(?:ya|ye|a|e|ı|i|ü|u)?(?=\\s)'),m=>{r.due=nextW(wdIdx(m[1]))});
  cut(new RegExp('\\s(\\d{1,2})\\s('+MON.map(low).join('|')+')(?=\\s)'),m=>{const d=new Date();const mi=MON.map(low).indexOf(m[2]);let x=new Date(d.getFullYear(),mi,+m[1]);if(ds(x)<T())x=new Date(d.getFullYear()+1,mi,+m[1]);r.due=ds(x)});
  cut(/\s(?:saat\s)?(\d{1,2})[:.](\d{2})(?=\s)/,m=>{if(+m[1]>23||+m[2]>59)return false;r.time=pad(+m[1])+':'+m[2]});
  if(!r.time)cut(/\ssaat\s(\d{1,2})(?=\s)/,m=>{if(+m[1]>23)return false;r.time=pad(+m[1])+':00'});
  if(r.repeat!=='none'&&!r.due)r.due=T();
  if(r.time&&!r.due)r.due=T();
  r.title=s.replace(/\s+/g,' ').trim();
  return r;
}

function section(title,tasks,o={}){
  if(!tasks.length&&!o.keep)return '';
  return '<div class="sec"><div class="sec-h'+(o.cls?' '+o.cls:'')+'"><h3>'+title+'<span class="n">'+tasks.length+'</span></h3>'+(o.right||'')+'</div>'+(tasks.length&&!o.collapsed?'<div class="group">'+tasks.map(t=>rowHTML(t,o.ctx)).join('')+'</div>':'')+'</div>';
}
function buckets(arr){
  const t=T(),g={over:[],today:[],tom:[],week:[],later:[],none:[]};
  arr.forEach(x=>{if(!x.due)g.none.push(x);else{const n=diff(x.due,t);(n<0?g.over:n===0?g.today:n===1?g.tom:n<7?g.week:g.later).push(x)}});
  Object.values(g).forEach(a=>a.sort(sortT));
  return section('Gecikmiş',g.over,{cls:'danger'})+section('Bugün',g.today)+section('Yarın',g.tom)+section('Bu hafta',g.week)+section('Daha sonra',g.later)+section('Tarihsiz',g.none);
}
function emptyHTML(icon,h,p){return '<div class="empty"><div class="big">'+icon+'</div><h3>'+h+'</h3><p>'+p+'</p></div>'}
function scope(){
  const t=T();
  if(ui.view==='today')return S.tasks.filter(x=>!x.done&&x.due&&x.due<=t);
  if(ui.view==='planned')return S.tasks.filter(x=>!x.done&&x.due&&(x.due===ui.day||(ui.day===t&&x.due<t)));
  if(ui.view==='tasks'&&ui.seg==='imp')return S.tasks.filter(x=>!x.done&&x.prio===3);
  if(ui.view==='tasks'&&ui.seg==='done')return S.tasks.filter(x=>x.done);
  return S.tasks.filter(x=>!x.done);
}
function catsHTML(){
  const base=scope();
  const pill=(id,name,col,ic,n)=>'<button class="cat" role="tab" data-act="cat" data-id="'+id+'" aria-selected="'+(ui.cat===id)+'" style="--c:'+col+'"><span class="cat-ic">'+ic+'</span><span>'+esc(name)+'</span>'+(n?'<span class="cnt">'+n+'</span>':'')+'</button>';
  return '<div class="cats" id="cats" role="tablist" aria-label="Kategoriler">'+pill('all','Tümü','var(--brand)',I.grid,base.length)+
    S.cats.map(c=>pill(c.id,c.name,cv(c.color),svg(c.icon),base.filter(x=>x.list===c.id).length)).join('')+
    '<button class="cat sq" data-act="catNew" aria-label="Yeni kategori">'+I.plus+'</button><button class="cat sq" data-act="catManage" aria-label="Kategorileri düzenle">'+I.sliders+'</button></div>';
}
function topHTML(title,eyebrow,o={}){

  return '<div class="top-in"><div class="top-row"><div class="eyebrow">'+eyebrow+'</div><div class="acts">'+acts+'</div></div><h1>'+title+'</h1>'+sb+(o.noCats?'':catsHTML())+'</div>';

function vToday(){
  const t=T(),d=new Date(),c=curCat();

  const dn=S.tasks.filter(x=>x.done&&x.doneAt&&ds(new Date(x.doneAt))===t&&inCat(x));
  const total=open.length+dn.length,pct=total?Math.round(dn.length/total*100):0;
  const over=open.filter(x=>x.due<t).sort(sortT),tod=open.filter(x=>x.due===t).sort(sortT);

  else{n='<div class="hero-n">'+open.length+'<small>görev kaldı</small></div>';s=dn.length+'/'+total+' tamamlandı'+(next?' · Sıradaki: <b>'+esc(next.title)+'</b>'+(next.time?' '+next.time:''):'')}

  if(S.example)h+='<div class="banner"><span>Uygulamayı tanıman için örnek görevler eklendi.</span><button data-act="clearExamples">Temizle</button></div>';

  h+=section('Gecikmiş',over,{cls:'danger',right:over.length?'<button class="act" data-act="moveOver">Bugüne taşı</button>':''})+section('Bugün',tod,{ctx:'today'});

  return h;

function vTasks(){
  const open=S.tasks.filter(x=>!x.done&&inCat(x));

  if(ui.seg==='open')h+=open.length?buckets(open):emptyHTML(I.done,'Açık görev yok','Her şey yolunda. Yeni bir görevi aşağıdan ekleyebilirsin.');

const F={mode:'work',dur:25,left:1500,run:false,end:0,task:'',iv:null};
const FM={work:{n:'Odak',m:25},short:{n:'Kısa mola',m:5},long:{n:'Uzun mola',m:15}};
function vFocus(){
  $('#top').innerHTML=topHTML('Odak','Pomodoro ve ilerleme',{noCats:true,noSearch:true});
  const t=T(),opts=S.tasks.filter(x=>!x.done&&x.due&&x.due<=t).sort(sortT);

  '<div class="dial'+(F.mode!=='work'?' brk':'')+'"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="90" fill="none" stroke-width="10"/><circle class="pr" id="dialP" cx="100" cy="100" r="90" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.49"/></svg><div class="dial-c"><div class="dial-t" id="dialT">25:00</div><div class="dial-s" id="dialS">'+FM[F.mode].n+'</div></div></div>'+
  '<div class="fsel"><select id="fTask" aria-label="Odaklanılacak görev"><option value="">Bir görev seç (isteğe bağlı)</option>'+opts.map(x=>'<option value="'+x.id+'"'+(F.task===x.id?' selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></div>'+
  '<div class="ctrl"><button class="icon-btn" data-act="freset" aria-label="Sıfırla">'+I.reset+'</button><button class="play" id="playBtn" data-act="fplay" aria-label="Başlat">'+(F.run?I.pause:I.play)+'</button><button class="icon-btn" data-act="fskip" aria-label="Sonraki aşama">'+I.skip+'</button></div></div>';
  let streak=0,day=t;if(!(S.hist[day]>0))day=add(day,-1);while(S.hist[day]>0){streak++;day=add(day,-1)}
  let week=0;for(let i=0;i<7;i++)week+=S.hist[add(t,-i)]||0;
  h+='<div class="stats"><div class="stat"><b>'+streak+'</b><span>günlük seri</span></div><div class="stat"><b>'+week+'</b><span>7 günde biten</span></div><div class="stat"><b>'+(S.focus[t]||0)+'</b><span>bugün odak seansı</span></div></div>';
  const vals=[];for(let i=6;i>=0;i--){const dd=add(t,-i);vals.push([dd,S.hist[dd]||0])}
  const mx=Math.max(1,...vals.map(v=>v[1]));
  h+='<div class="sec"><div class="sec-h"><h3>Son 7 gün<span class="n">tamamlanan görev</span></h3></div><div class="bars">'+vals.map(([dd,v])=>'<div class="bar'+(dd===t?' now':'')+'"><i style="height:'+Math.max(4,v/mx*100)+'%"></i><em>'+v+'</em><small>'+DSH[pd(dd).getDay()]+'</small></div>').join('')+'</div></div>';
  return h;
}
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function fPaint(){
  $('#liveDot').hidden=!F.run;const t=$('#dialT');if(!t)return;
  t.textContent=fmt(F.left);$('#dialS').textContent=F.run?FM[F.mode].n+' · sürüyor':FM[F.mode].n;
  $('#dialP').style.strokeDashoffset=565.49*(1-F.left/(F.dur*60));
  $('#playBtn').innerHTML=F.run?I.pause:I.play;$('#playBtn').setAttribute('aria-label',F.run?'Duraklat':'Başlat');
}
let wl=null;
async function wake(on){try{if(on&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null}}catch(e){}}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const a=actx;[0,.25,.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.2);o.start(a.currentTime+d);o.stop(a.currentTime+d+.22)})}catch(e){}}
function setMode(m){F.mode=m;F.dur=FM[m].m;F.left=F.dur*60;F.run=false;clearInterval(F.iv);wake(false)}
function tick(){F.left=Math.max(0,Math.round((F.end-Date.now())/1000));if(F.left===0){clearInterval(F.iv);F.run=false;wake(false);beep();
  if(F.mode==='work'){S.focus[T()]=(S.focus[T()]||0)+1;save();toast('Odak seansı bitti · mola zamanı',false);setMode(S.focus[T()]%4===0?'long':'short')}else{toast('Mola bitti · odaklanmaya hazır',false);setMode('work')}
  if(ui.view==='focus')render()}fPaint()}

function render(){
  try{localStorage.setItem(KEY+'.ui',JSON.stringify({view:ui.view,cat:ui.cat}))}catch(e){}
  if(ui.cat!=='all'&&!C(ui.cat))ui.cat='all';
  applyCat();
  const oc=$('#cats'),sl=oc?oc.scrollLeft:0;
  $('#main').innerHTML={today:vToday,planned:vPlanned,tasks:vTasks,focus:vFocus}[ui.view]();
  $$('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.view===ui.view?'page':'false'));
  $('#composerWrap').hidden=ui.view==='focus';
  $('#main').style.paddingBottom=ui.view==='focus'?'calc(100px + env(safe-area-inset-bottom,0px))':'';
  paintComposer();
  if(ui.view==='focus')fPaint();else $('#liveDot').hidden=!F.run;
  const nc=$('#cats');if(nc){nc.scrollLeft=sl;if(ui.scrollCat){const a=nc.querySelector('[aria-selected="true"]');if(a){const l=a.offsetLeft-24,r=a.offsetLeft+a.offsetWidth-nc.clientWidth+24;if(nc.scrollLeft>l)nc.scrollTo({left:l,behavior:'smooth'});else if(nc.scrollLeft<r)nc.scrollTo({left:r,behavior:'smooth'})}ui.scrollCat=false}}
  const q=$('#q');if(q)q.oninput=()=>{ui.q=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const ft=$('#fTask');if(ft)ft.onchange=()=>{F.task=ft.value};
}

    h+=ui.confirm==='del'?'<div class="glist" style="padding:14px;display:grid;gap:12px"><div style="font-size:15px">“'+esc(d.name)+'” ve içindeki <b>'+n+' görev</b> silinecek.</div><div class="btn-row"><button class="btn dan" data-act="catDelYes">Sil</button><button class="btn" data-act="catDelNo">Vazgeç</button></div></div>':'<button class="btn dan wide" data-act="catDel">'+I.trash.replace('<svg','<svg width="18" height="18"')+'Kategoriyi sil</button>'}
  return h;
}
function bindCat(){
  const inp=$('#cName');
  inp.oninput=()=>{ui.draft.name=inp.value;if(!ui.draft.touched){const g=guessIcon(inp.value);if(g!==ui.draft.icon){ui.draft.icon=g;$('#cIc').innerHTML=svg(g);$$('.icn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.i===g))}}};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveCat()}};
  if(!ui.sheet.id&&!ui.draft.name)setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},350);
}
function saveCat(){
  const d=ui.draft,name=d.name.trim();
  if(!name){const i=$('#cName');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');i.focus();return}
  const from=ui.sheet.from;
  if(ui.sheet.id){const c=C(ui.sheet.id);Object.assign(c,{name,color:d.color,icon:d.icon});save();toast('Kategori kaydedildi',false)}
  else{const c={id:uid(),name,color:d.color,icon:d.icon};S.cats.push(c);save();
    if(from==='tgt')ui.tgt=c.id;else if(from!=='mgr'){ui.cat=c.id;ui.tgt=c.id;ui.scrollCat=true}
    toast('“'+name+'” eklendi',false)}
  if(from==='mgr'){ui.draft=null;openSheet({t:'mgr'});render()}else closeSheet();
}
function openCatEdit(id,from){
  const c=id?C(id):null;
  const used=S.cats.map(x=>x.color),free=COLORS.find(x=>!used.includes(x))||COLORS[Math.floor(Math.random()*COLORS.length)];
  ui.draft=c?{name:c.name,color:c.color,icon:c.icon,touched:true}:{name:'',color:free,icon:'star',touched:false};
  ui.confirm=null;ui.pop=false;paintPop();openSheet({t:'cat',id:id||null,from:from||null});
}

  '<div><div class="lbl">Genel</div><div class="glist"><button class="srow" data-act="catManage"><span class="ic" style="--c:var(--brand)">'+I.grid+'</span><span class="nm">Kategoriler</span><span class="v">'+S.cats.length+'</span><span class="chev">'+I.chev+'</span></button>'+
   '<label class="srow"><span class="ic" style="--c:var(--c-pink)">'+I.sound+'</span><span class="nm">Tamamlama sesi</span><input type="checkbox" class="tg" id="setSound"'+(S.settings.sound?' checked':'')+'></label></div></div>'+

   '<p class="hint">Örnek: “yarın 15:00 teklifi gönder #iş !!”</p></div>'+
  '<div><div class="lbl">Veriler</div><div class="glist">'+
   '<button class="srow" data-act="copyData"><span class="ic" style="--c:var(--c-teal)">'+I.copy+'</span><span class="nm">Yedeği kopyala</span></button>'+
   '<button class="srow" data-act="toggleData"><span class="ic" style="--c:var(--c-indigo)">'+I.upload+'</span><span class="nm">Yedekten yükle</span><span class="chev">'+(ui.dataOpen?I.down:I.chev)+'</span></button>'+
   (ui.dataOpen?'<div class="data"><textarea id="dataIn" placeholder="Yedek metnini buraya yapıştır" aria-label="Yedek metni"></textarea><button class="btn pri" data-act="importData">Yükle</button></div>':'')+
   (ui.confirm==='reset'?'<div class="data"><div style="font-size:15px">Tüm görevler ve istatistikler silinecek. Kategorilerin kalır.</div><div class="btn-row"><button class="btn dan" data-act="resetYes">Hepsini sil</button><button class="btn" data-act="resetNo">Vazgeç</button></div></div>':'<button class="srow danger" data-act="reset"><span class="ic" style="--c:var(--danger)">'+I.trash+'</span><span class="nm">Tüm görevleri sil</span></button>')+
  '</div><p class="hint">Görevlerin yalnızca bu cihazda saklanır. Başka cihaza taşımak için yedeği kopyalayıp orada yapıştır.</p></div>'+
  '<p class="hint" style="text-align:center;margin-top:-4px">My Checklist 2.0</p>';
}
function bindSettings(){const s=$('#setSound');if(s)s.onchange=()=>{S.settings.sound=s.checked;save();if(s.checked)popSound()}}
function shTask(){
  const t=findT(ui.sheet.id);if(!t)return '';
  const tm=T(),tmr=add(tm,1),we=nextSat(),mo=nextMon(),c=C(t.list);
  const dp=(v,lab,val)=>'<button class="pill" data-act="sDue" data-v="'+v+'" aria-pressed="'+(v==='none'?!t.due:t.due===val)+'">'+lab+'</button>';
  const sd=t.subs.filter(s=>s.d).length;
  return '<div class="sh-top"><button class="chk'+(t.done?' on':'')+'" data-act="chk" style="--c:'+(c?cv(c.color):'var(--c-slate)')+'" aria-label="Tamamla">'+I.check+'</button><textarea class="sh-title" id="sTitle" rows="1" aria-label="Görev adı">'+esc(t.title)+'</textarea></div>'+
   '<textarea class="notes" id="sNotes" placeholder="Not ekle" aria-label="Not">'+esc(t.notes)+'</textarea>'+
   '<div><div class="lbl"><span>Kategori</span></div><div class="pills">'+S.cats.map(l=>'<button class="pill" data-act="sList" data-v="'+l.id+'" style="--c:'+cv(l.color)+'" aria-pressed="'+(t.list===l.id)+'"><span class="pi">'+svg(l.icon)+'</span>'+esc(l.name)+'</button>').join('')+'<button class="pill" data-act="sList" data-v="" style="--c:var(--c-slate)" aria-pressed="'+!t.list+'">Genel</button></div></div>'+
   '<div><div class="lbl"><span>Tarih</span><span class="v">'+(t.due?human(t.due)+' · '+pd(t.due).getDate()+' '+MON[pd(t.due).getMonth()]:'')+'</span></div><div class="pills">'+dp('t','Bugün',tm)+dp('tm','Yarın',tmr)+(we!==tm&&we!==tmr?dp('we','Hafta sonu',we):'')+(mo!==tmr?dp('nw','Gelecek hafta',mo):'')+dp('none','Tarihsiz',null)+
     '<label class="pill">'+I.cal+'<input type="date" id="sDate" value="'+(t.due||'')+'" aria-label="Tarih seç"></label></div></div>'+
   '<div><div class="lbl"><span>Saat</span></div><div class="pills"><label class="pill" aria-pressed="'+!!t.time+'">'+I.clock+'<input type="time" id="sTime" value="'+(t.time||'')+'" aria-label="Saat"></label>'+(t.time?'<button class="pill" data-act="sClearTime">Kaldır</button>':'')+'</div></div>'+
   '<div><div class="lbl"><span>Tekrar</span></div><div class="seg">'+Object.entries(REP).map(([k,v])=>'<button data-act="sRep" data-v="'+k+'" aria-pressed="'+(t.repeat===k)+'">'+v+'</button>').join('')+'</div></div>'+
   '<div><div class="lbl"><span>Öncelik</span></div><div class="seg">'+['Yok','Düşük','Orta','Yüksek'].map((v,i)=>'<button data-act="sPrio" data-v="'+i+'" aria-pressed="'+(t.prio===i)+'">'+v+'</button>').join('')+'</div></div>'+
   '<div><div class="lbl"><span>Alt görevler</span><span class="v">'+(t.subs.length?sd+'/'+t.subs.length:'')+'</span></div><div class="subs">'+t.subs.map(s=>'<div class="sub'+(s.d?' d':'')+'"><button class="chk'+(s.d?' on':'')+'" data-act="subChk" data-id="'+s.id+'" style="--c:'+(c?cv(c.color):'var(--c-slate)')+'" aria-label="Alt görevi işaretle">'+I.check+'</button><input data-sub="'+s.id+'" value="'+esc(s.t)+'" aria-label="Alt görev"><button class="x" data-act="subDel" data-id="'+s.id+'" aria-label="Alt görevi sil">'+I.x+'</button></div>').join('')+
     '<div class="sub"><span class="plus">'+I.plus+'</span><input id="subNew" placeholder="Alt görev ekle" enterkeyhint="done" aria-label="Yeni alt görev"></div></div></div>'+
   '<div class="sh-foot"><button class="btn dan" data-act="sDel">Sil</button><button class="btn pri" data-act="shClose">Tamam</button></div>';
}
function bindTask(){
  const t=findT(ui.sheet.id);if(!t)return;
  const ti=$('#sTitle'),fit=el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px'};fit(ti);fit($('#sNotes'));
  ti.oninput=()=>{t.title=ti.value.replace(/\n/g,' ');fit(ti);save()};ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ti.blur()}};
  ti.onblur=()=>{if(!t.title.trim()){t.title='Adsız görev';ti.value=t.title}save();render()};
  const no=$('#sNotes');no.oninput=()=>{t.notes=no.value;fit(no);save()};
  $('#sDate').onchange=e=>{t.due=e.target.value||null;commit()};
  $('#sTime').onchange=e=>{t.time=e.target.value||null;if(t.time&&!t.due)t.due=T();commit()};
  $$('[data-sub]').forEach(inp=>inp.oninput=()=>{t.subs.find(s=>s.id===inp.dataset.sub).t=inp.value;save()});
  const sn=$('#subNew');sn.onkeydown=e=>{if(e.key==='Enter'&&sn.value.trim()){e.preventDefault();t.subs.push({id:uid(),t:sn.value.trim(),d:false});commit();$('#subNew').focus()}};
}
function commit(){save();paintSheet();render()}
const nextSat=()=>add(T(),(6-new Date().getDay()+7)%7);
const nextMon=()=>add(T(),(1-new Date().getDay()+7)%7||7);
function applyPreset(p,replace){
  const mk=([n,i,c])=>({id:uid(),name:n,icon:i,color:c});
  if(replace){S.cats=p.c.map(mk);return p.c.length}
  let k=0;p.c.forEach(x=>{if(!S.cats.some(c=>low(c.name)===low(x[0]))){S.cats.push(mk(x));k++}});return k;
}
$('#scrim').onclick=closeSheet;

/* ================= events ================= */
let lpFired=false;
document.addEventListener('click',e=>{
  if(ui.pop&&!e.target.closest('.pop,#tgt')){ui.pop=false;paintPop()}
  const b=e.target.closest('[data-act]');
  if(!b){const row=e.target.closest('.row-in');if(row&&!swiped)openSheet({t:'task',id:row.parentElement.dataset.id});return}
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'chk':{e.stopPropagation();const row=b.closest('.row');const tid=row?row.dataset.id:ui.sheet.id;const t=findT(tid);if(!t)break;
      if(row&&!t.done){b.classList.add('on');setTimeout(()=>{row.style.height=row.offsetHeight+'px';row.offsetHeight;row.classList.add('leaving');row.style.height='0px';setTimeout(()=>{complete(tid);render()},260)},260)}
      else{complete(tid);render()}
      if(!row)closeSheet();break}
    case 'cat':if(lpFired){lpFired=false;break}ui.cat=id;if(id!=='all')ui.tgt=id;ui.scrollCat=true;render();break;
    case 'catNew':openCatEdit(null,ui.sheet&&ui.sheet.t==='mgr'?'mgr':null);break;
    case 'catManage':ui.draft=null;openSheet({t:'mgr'});break;
    case 'catEdit':openCatEdit(id,'mgr');break;
    case 'toMgr':ui.draft=null;openSheet({t:'mgr'});break;
    case 'dColor':ui.draft.color=b.dataset.c;paintSheet();break;
    case 'dIcon':ui.draft.icon=b.dataset.i;ui.draft.touched=true;paintSheet();break;
    case 'dSugg':{const s=SUGG.find(x=>x[0]===b.dataset.n);Object.assign(ui.draft,{name:s[0],icon:s[1],color:s[2],touched:true});paintSheet();break}
    case 'catSave':saveCat();break;
    case 'catDel':ui.confirm='del';paintSheet();break;
    case 'catDelNo':ui.confirm=null;paintSheet();break;
    case 'catDelYes':{snapshot();const cid=ui.sheet.id,from=ui.sheet.from,nm=C(cid).name;S.tasks=S.tasks.filter(t=>t.list!==cid);S.cats=S.cats.filter(c=>c.id!==cid);if(ui.cat===cid)ui.cat='all';if(ui.tgt===cid)ui.tgt=null;save();
      if(from==='mgr'){ui.draft=null;openSheet({t:'mgr'});render()}else closeSheet();toast('“'+nm+'” silindi',true);break}
    case 'presetAdd':{const k=applyPreset(PRESETS.find(p=>p.id===id),false);save();paintSheet();render();toast(k?k+' kategori eklendi':'Bu setteki kategoriler zaten var',false);break}
    case 'presetPick':{applyPreset(PRESETS.find(p=>p.id===id),true);S.tasks=[];S.hist={};S.focus={};S.example=false;S.onboarded=true;ui.cat='all';ui.tgt=null;save();closeSheet();toast('Hazır. İlk görevini aşağıdan ekle',false);break}
    case 'keepSample':S.onboarded=true;save();closeSheet();break;
    case 'startBlank':S.cats=[];S.tasks=[];S.hist={};S.focus={};S.example=false;S.onboarded=true;ui.cat='all';ui.tgt=null;save();openCatEdit(null,null);break;
    case 'tgt':ui.pop=!ui.pop;paintPop();break;
    case 'tgtPick':ui.tgt=id||null;ui.pop=false;paintPop();paintComposer();quick.focus();break;
    case 'tgtNew':openCatEdit(null,'tgt');break;
    case 'go':ui.view=b.dataset.view;render();break;
    case 'day':ui.day=b.dataset.d;render();break;
    case 'seg':ui.seg=b.dataset.v;render();break;
    case 'search':ui.searchOpen=!ui.searchOpen;if(!ui.searchOpen)ui.q='';render();if(ui.searchOpen)$('#q').focus();break;
    case 'closeSearch':ui.searchOpen=false;ui.q='';render();break;
    case 'settings':ui.confirm=null;ui.dataOpen=false;openSheet({t:'settings'});break;
    case 'toggleDone':ui.showDone=!ui.showDone;render();break;
    case 'clearExamples':snapshot();S.tasks=[];S.hist={};S.focus={};S.example=false;save();render();toast('Örnekler temizlendi',true);break;
    case 'moveOver':snapshot();S.tasks.forEach(t=>{if(!t.done&&t.due&&t.due<T()&&inCat(t))t.due=T()});save();render();toast('Gecikenler bugüne taşındı',true);break;
    case 'clearDone':snapshot();S.tasks=S.tasks.filter(t=>!(t.done&&inCat(t)));save();render();toast('Tamamlananlar temizlendi',true);break;
    case 'theme':S.settings.theme=b.dataset.v;save();applyTheme();paintSheet();break;
    case 'copyData':{const txt=JSON.stringify(S);const fb=()=>{ui.dataOpen=true;paintSheet();const ta=$('#dataIn');ta.value=txt;ta.select();toast('Metni seçip kopyala',false)};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Yedek panoya kopyalandı',false),fb)}catch(err){fb()}break}
    case 'toggleData':ui.dataOpen=!ui.dataOpen;paintSheet();break;
    case 'importData':{try{const o=normalize(JSON.parse($('#dataIn').value));if(!o)throw 0;snapshot();S=o;S.example=false;S.onboarded=true;save();ui.dataOpen=false;applyTheme();paintSheet();render();toast('Yedek yüklendi',true)}catch(err){toast('Yedek okunamadı. Metnin tamamını yapıştır',false)}break}
    case 'reset':ui.confirm='reset';paintSheet();break;
    case 'resetNo':ui.confirm=null;paintSheet();break;
    case 'resetYes':snapshot();S.tasks=[];S.hist={};S.focus={};S.example=false;ui.confirm=null;save();paintSheet();render();toast('Tüm görevler silindi',true);break;
    case 'fmode':setMode(b.dataset.m);render();break;
    case 'fplay':if(F.run){F.run=false;clearInterval(F.iv);F.left=Math.max(0,Math.round((F.end-Date.now())/1000));wake(false)}else{F.run=true;F.end=Date.now()+F.left*1000;clearInterval(F.iv);F.iv=setInterval(tick,250);wake(true)}fPaint();break;
    case 'freset':setMode(F.mode);fPaint();break;
    case 'fskip':setMode(F.mode==='work'?'short':'work');render();break;
    case 'sDue':{const t=findT(ui.sheet.id),v=b.dataset.v;t.due=v==='none'?null:v==='t'?T():v==='tm'?add(T(),1):v==='we'?nextSat():nextMon();if(!t.due)t.repeat='none';commit();break}
    case 'sClearTime':findT(ui.sheet.id).time=null;commit();break;
    case 'sRep':{const t=findT(ui.sheet.id);t.repeat=b.dataset.v;if(t.repeat!=='none'&&!t.due)t.due=T();commit();break}
    case 'sPrio':findT(ui.sheet.id).prio=+b.dataset.v;commit();break;
    case 'sList':findT(ui.sheet.id).list=b.dataset.v||null;commit();break;
    case 'subChk':{const s=findT(ui.sheet.id).subs.find(s=>s.id===b.dataset.id);s.d=!s.d;if(s.d)popSound();commit();break}
    case 'subDel':{const t=findT(ui.sheet.id);t.subs=t.subs.filter(s=>s.id!==b.dataset.id);commit();break}
    case 'sDel':{const tid=ui.sheet.id;closeSheet();removeTask(tid);render();break}
    case 'shClose':closeSheet();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.pop){ui.pop=false;paintPop()}else if(ui.sheet)closeSheet()}});
$$('.tab').forEach(b=>b.onclick=()=>{ui.view=b.dataset.view;ui.q='';ui.searchOpen=false;ui.showDone=false;ui.pop=false;paintPop();if(ui.view==='planned')ui.day=T();render();scrollTo({top:0,behavior:'smooth'})});
addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>4),{passive:true});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.cat,.row-in'))e.preventDefault()});

/* long-press a category tab to edit it */
let lpT=null,lpX=0;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.cat[data-id]');if(!c||c.dataset.id==='all')return;lpFired=false;lpX=e.clientX;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpFired=true;try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}openCatEdit(c.dataset.id,null)},520)});
document.addEventListener('pointermove',e=>{if(lpT&&Math.abs(e.clientX-lpX)>8){clearTimeout(lpT);lpT=null}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(lpT);lpT=null}));

/* drag to reorder categories */
let drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;e.preventDefault();const row=h.closest('.mrow');drag={row,list:row.parentElement};row.classList.add('lift');try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!drag)return;const y=e.clientY;const rows=[...drag.list.querySelectorAll('.mrow[data-id]')].filter(r=>r!==drag.row);
  const before=rows.find(r=>{const b=r.getBoundingClientRect();return y<b.top+b.height/2})||drag.list.querySelector('.add-row');
  if(drag.row.nextElementSibling!==before){drag.list.insertBefore(drag.row,before);try{navigator.vibrate&&navigator.vibrate(5)}catch(_){}}});
function endDrag(){if(!drag)return;drag.row.classList.remove('lift');const order=[...drag.list.querySelectorAll('.mrow[data-id]')].map(r=>r.dataset.id);drag=null;
  S.cats.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));save();render()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

/* swipe rows */
let sx=0,sy=0,dx=0,lock=null,cur=null,swiped=false;
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.row-in');if(!r||e.target.closest('.chk')||e.button>0||r.closest('.sheet'))return;cur=r;sx=e.clientX;sy=e.clientY;dx=0;lock=null;swiped=false;r.classList.remove('snap')});
document.addEventListener('pointermove',e=>{if(!cur)return;const x=e.clientX-sx,y=e.clientY-sy;
  if(!lock){if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y))lock='h';else if(Math.abs(y)>10){lock='v';cur=null;return}else return;try{cur.setPointerCapture(e.pointerId)}catch(_){}}
  if(lock==='h'){dx=x;swiped=true;cur.style.transform='translateX('+dx+'px)';const row=cur.parentElement;row.classList.toggle('sw-r',dx>0);row.classList.toggle('sw-l',dx<0)}});
function endSwipe(){if(!cur)return;const r=cur,row=r.parentElement,id=row.dataset.id;cur=null;
  if(lock==='h'&&Math.abs(dx)>90){r.classList.add('snap');r.style.transform='translateX('+(dx>0?'110%':'-110%')+')';
    setTimeout(()=>{row.style.height=row.offsetHeight+'px';row.offsetHeight;row.style.height='0px';setTimeout(()=>{const t=findT(id);if(dx>0){if(t&&!t.done)complete(id)}else removeTask(id);render()},240)},180)}
  else{r.classList.add('snap');r.style.transform='';setTimeout(()=>row.classList.remove('sw-r','sw-l'),250)}
  setTimeout(()=>swiped=false,50)}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);

/* boot */
let lastDay=T();setInterval(()=>{if(T()!==lastDay){lastDay=T();ui.day=T();render()}},60000);
applyTheme();render();
if(fresh&&!S.onboarded)setTimeout(()=>openSheet({t:'welcome'}),250);
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
