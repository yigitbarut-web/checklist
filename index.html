<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Gün Sonu Checklist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .main-tabs, .sub-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #ddd;
      font-weight: bold;
    }

    button.active {
      background: #333;
      color: #fff;
    }

    .app {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
    }

    input {
      width: 70%;
      padding: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 10px;
    }

    li {
      display: flex;
      align-items: center;
      padding: 10px 5px;
      border-bottom: 1px solid #eee;
    }

    .handle {
      cursor: grab;
      margin-right: 8px;
    }

    .text {
      flex: 1;
    }

    .status {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .status span {
      opacity: 0.25;
      cursor: pointer;
    }

    .status span.active {
      opacity: 1;
    }

    .del {
      margin-left: 6px;
    }
  </style>
</head>
<body>

<h1>✔ Gün Sonu Checklist</h1>

<div class="main-tabs">
  <button data-main="work" class="active">İş</button>
  <button data-main="personal">Özel Hayat</button>
  <button data-main="nutrition">Beslenme</button>
</div>

<div class="sub-tabs" id="subTabs">
  <button data-sub="daily" class="active">Günlük</button>
  <button data-sub="weekly">Haftalık</button>
</div>

<div class="app">
  <input id="itemInput" placeholder="Yeni görev..." />
  <button id="addBtn">Ekle</button>
  <ul id="list"></ul>
</div>

<script>
const listEl = document.getElementById("list");
const input = document.getElementById("itemInput");
const addBtn = document.getElementById("addBtn");
const mainTabs = document.querySelectorAll(".main-tabs button");
const subTabs = document.querySelectorAll(".sub-tabs button");
const subTabsContainer = document.getElementById("subTabs");

let main = "work";
let sub = "daily";

let data = JSON.parse(localStorage.getItem("checklist_live")) || {
  work_daily: [],
  work_weekly: [],
  personal_daily: [],
  personal_weekly: [],
  nutrition: []
};

function key() {
  return main === "nutrition" ? "nutrition" : `${main}_${sub}`;
}

function save() {
  localStorage.setItem("checklist_live", JSON.stringify(data));
}

function render() {
  listEl.innerHTML = "";

  data[key()].forEach((item, i) => {
    const li = document.createElement("li");

    li.innerHTML = `
      <span class="handle">≡</span>
      <span class="text">${item.text}</span>
      <div class="status">
        <span class="${item.status === 'success' ? 'active' : ''}" onclick="setStatus(${i}, 'success')">✅</span>
        <span class="${item.status === 'fail' ? 'active' : ''}" onclick="setStatus(${i}, 'fail')">❌</span>
      </div>
      <button class="del" onclick="removeItem(${i})">✖</button>
    `;

    listEl.appendChild(li);
  });

  Sortable.create(listEl, {
    handle: ".handle",
    animation: 150
  });
}

function addItem() {
  if (!input.value.trim()) return;
  data[key()].push({ text: input.value.trim(), status: null });
  input.value = "";
  save();
  render();
}

function setStatus(i, status) {
  data[key()][i].status = status;
  save();
  render();
}

function removeItem(i) {
  data[key()].splice(i, 1);
  save();
  render();
}

addBtn.onclick = addItem;
input.onkeydown = e => e.key === "Enter" && addItem();

mainTabs.forEach(b => b.onclick = () => {
  mainTabs.forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  main = b.dataset.main;
  subTabsContainer.style.display = main === "nutrition" ? "none" : "flex";
  render();
});

subTabs.forEach(b => b.onclick = () => {
  subTabs.forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  sub = b.dataset.sub;
  render();
});

render();
</script>

</body>
</html>
