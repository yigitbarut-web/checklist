<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Checklist</title>

<!-- Drag için -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  background:#f4f4f4;
  padding:20px;
  text-align:center;
}

h1 { margin-bottom:20px; }

.main-tabs, .sub-tabs {
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

button {
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#ddd;
  cursor:pointer;
}

button.active {
  background:#333;
  color:#fff;
}

.input-area {
  display:flex;
  gap:8px;
  margin:15px auto;
  max-width:420px;
}

input {
  flex:1;
  padding:10px;
  font-size:16px;
}

ul {
  list-style:none;
  padding:0;
  max-width:420px;
  margin:auto;
}

li {
  background:#fff;
  padding:10px;
  margin-bottom:8px;
  border-radius:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.actions span {
  margin-left:8px;
  cursor:pointer;
  opacity:.4;
  font-size:18px;
}

.actions span.active { opacity:1; }
.ok.active { color:green; }
.no.active { color:red; }
</style>
</head>

<body>

<h1>✔ My Checklist</h1>

<div class="main-tabs">
  <button class="main active" data-mode="is">İş</button>
  <button class="main" data-mode="ozel">Özel Hayat</button>
  <button class="main" data-mode="beslenme">Beslenme</button>
</div>

<div class="sub-tabs">
  <button class="sub active" data-time="gunluk">Günlük</button>
  <button class="sub" data-time="haftalik">Haftalık</button>
</div>

<div class="input-area">
  <input id="taskInput" placeholder="Yeni görev yaz...">
  <button id="addBtn">Ekle</button>
</div>

<ul id="list"></ul>

<script>
let mode="is", time="gunluk";
let tasks = JSON.parse(localStorage.getItem("myChecklist")) || [];

const input = document.getElementById("taskInput");
const list = document.getElementById("list");

function save(){
  localStorage.setItem("myChecklist", JSON.stringify(tasks));
}

function render(){
  list.innerHTML="";
  tasks.filter(t=>t.mode===mode && t.time===time).forEach(t=>{
    const li=document.createElement("li");
    li.innerHTML=`
      <span>${t.text}</span>
      <div class="actions">
        <span class="ok ${t.status==='ok'?'active':''}">✅</span>
        <span class="no ${t.status==='no'?'active':''}">❌</span>
        <span class="del">✖</span>
      </div>`;
    
    li.querySelector(".ok").onclick=()=>{t.status="ok";save();render();}
    li.querySelector(".no").onclick=()=>{t.status="no";save();render();}
    li.querySelector(".del").onclick=()=>{tasks=tasks.filter(x=>x!==t);save();render();}
    list.appendChild(li);
  });
}

document.getElementById("addBtn").onclick=()=>{
  if(!input.value.trim())return;
  tasks.push({text:input.value,mode,time,status:null});
  input.value="";
  save();render();
};

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("addBtn").click();
});

document.querySelectorAll(".main").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".main").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    mode=b.dataset.mode;
    render();
  }
});

document.querySelectorAll(".sub").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".sub").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    time=b.dataset.time;
    render();
  }
});

render();
</script>

</body>
</html>
